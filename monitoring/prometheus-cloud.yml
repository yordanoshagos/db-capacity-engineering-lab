# Prometheus — rehosted app on the Linux host / Codespace (:3000)
# Used by docker compose -f docker-compose.obs.yml
global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: capacity-api
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3000']
