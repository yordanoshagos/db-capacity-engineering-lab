# C5 bait: an unpinned uses: so zizmor fails while the real CI caller stays SHA-pinned.
# Unpinning the reusable workflow itself (@v1) does not start jobs — the group repo has no v1 tag.
name: c5-zizmor-bait

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bait:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
